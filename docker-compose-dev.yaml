# Full dev stack including the Next.js app itself:
#   docker compose -f docker-compose-dev.yaml up
# Reads credentials from .env like the base docker-compose.yml. The app
# container overrides DATABASE_URL / MINIO_ENDPOINT to reach the services
# over the compose network (the .env values point at localhost host ports).
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5464:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  nextjs:
    image: node:22
    restart: unless-stopped
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm exec prisma migrate deploy && pnpm dev -- -H 0.0.0.0"
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # keep container-built deps/artifacts off the host checkout
      - nextjs_node_modules:/app/node_modules
      - nextjs_next:/app/.next
    depends_on:
      - postgres
      - minio

volumes:
  postgres_data:
  minio_data:
  nextjs_node_modules:
  nextjs_next:
